<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav class="navbar">
    <span class="nav-title">TETRIS</span>
    <button id="theme-toggle" class="theme-toggle" type="button" role="switch" aria-checked="false" aria-label="Modo claro">
      <span id="theme-label">Oscuro</span>
      <span class="track"><span class="thumb"></span></span>
    </button>
  </nav>

  <div class="wrapper">
    <div class="game-container">
      <aside class="panel hold-panel">
        <div class="panel-section">
          <span class="label">HOLD</span>
          <canvas id="hold-canvas" width="120" height="120"></canvas>
        </div>
        <div class="panel-section hidden" id="queue-section">
          <span class="label">QUEUE</span>
          <canvas id="queue-canvas" width="120" height="240"></canvas>
        </div>
      </aside>

      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>
        <div class="panel-section">
          <span class="label">ENERGY</span>
          <div class="energy-bar" id="energy-bar"><div class="energy-fill" id="energy-fill"></div></div>
          <span class="energy-status" id="energy-status"></span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>C</kbd><kbd>Shift</kbd> reservar</li>
            <li><kbd>E</kbd> habilidad</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <ul id="ability-list" class="ability-list hidden"></ul>
        <div id="records" class="records hidden">
          <form id="name-form" class="name-form hidden" autocomplete="off">
            <label for="name-input">¡Entraste al top 5! Tu nombre:</label>
            <div class="name-row">
              <input id="name-input" type="text" maxlength="12" value="Jugador" />
              <button type="submit" id="save-record-btn">Guardar</button>
            </div>
          </form>
          <span class="label">RECORDS</span>
          <table class="records-table">
            <thead>
              <tr><th>#</th><th>Nombre</th><th>Puntos</th><th>Líneas</th><th>Nv</th><th>Combo</th><th>Fecha</th></tr>
            </thead>
            <tbody id="records-body"></tbody>
          </table>
          <p class="records-best">
            Mejor combo: <span id="best-combo">0</span> · Líneas máximas: <span id="max-lines">0</span>
          </p>
          <button type="button" id="reset-records-btn" class="link-btn">Resetear records</button>
        </div>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
